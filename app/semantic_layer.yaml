# ==============================================================================
# app/semantic_layer.yaml - NexusBI Semantic Definitions & Business Metrics
#
# Provides plain-English descriptions, column data types, business calculation
# formulas, and reference few-shot query patterns to prevent LLM hallucinations.
# ==============================================================================

version: "1.0"

marts:
  mart_daily_sales:
    description: "Daily aggregated e-commerce transactions and gross merchandise volume."
    grain: "One row per calendar day (sales_date)."
    columns:
      sales_date:
        type: "DATE"
        description: "Calendar date of order purchase."
      total_orders:
        type: "INTEGER"
        description: "Count of distinct non-canceled customer orders on this date."
      total_items_sold:
        type: "INTEGER"
        description: "Total physical items/units sold across all carts."
      total_revenue:
        type: "NUMERIC"
        description: "Gross merchandise sales volume in Brazilian Reais (BRL)."
      total_freight:
        type: "NUMERIC"
        description: "Total shipping fees paid by buyers."
      avg_order_value:
        type: "NUMERIC"
        description: "Daily average order value (total_revenue / total_orders)."

  mart_top_products:
    description: "Product catalog performance with units sold, revenue, and dense ranks."
    grain: "One row per unique product (product_id)."
    columns:
      product_id:
        type: "VARCHAR"
        description: "Unique product identifier hash."
      category_name:
        type: "VARCHAR"
        description: "English translated category name (e.g. bed_bath_table, health_beauty, sports_leisure)."
      units_sold:
        type: "INTEGER"
        description: "Lifetime total units of this product sold."
      total_revenue:
        type: "NUMERIC"
        description: "Lifetime gross revenue generated by this product."
      avg_unit_price:
        type: "NUMERIC"
        description: "Average price per unit sold (total_revenue / units_sold)."
      revenue_rank:
        type: "INTEGER"
        description: "Dense rank by total revenue (1 = top revenue generator)."
      units_sold_rank:
        type: "INTEGER"
        description: "Dense rank by units sold (1 = most units sold)."

  mart_customer_summary:
    description: "Customer dimension with lifetime spend and Brazilian geography."
    grain: "One row per unique buyer (customer_unique_id)."
    columns:
      customer_unique_id:
        type: "VARCHAR"
        description: "Unique identifier for individual buyers across repeat purchases."
      customer_city:
        type: "VARCHAR"
        description: "Customer resident city."
      customer_state:
        type: "VARCHAR"
        description: "Brazilian 2-letter state abbreviation (e.g. SP, RJ, MG, RS, PR)."
      total_orders:
        type: "INTEGER"
        description: "Lifetime count of non-canceled orders placed by this customer."
      total_spend:
        type: "NUMERIC"
        description: "Customer lifetime spend (LTV) including items and freight charges."
      first_order_date:
        type: "TIMESTAMP"
        description: "Timestamp of customer's first purchase."
      last_order_date:
        type: "TIMESTAMP"
        description: "Timestamp of customer's latest purchase."

  mart_delivery_performance:
    description: "Monthly logistics SLA tracking, transit lead times, and carrier performance."
    grain: "One row per calendar month (order_month / year_month)."
    columns:
      order_month:
        type: "DATE"
        description: "First calendar day of the purchase month (e.g. 2018-01-01)."
      year_month:
        type: "VARCHAR"
        description: "Formatted year and month string (YYYY-MM)."
      total_delivered_orders:
        type: "INTEGER"
        description: "Total count of orders successfully delivered to customers."
      avg_delivery_days:
        type: "NUMERIC"
        description: "Actual average days elapsed from order purchase to customer delivery."
      avg_estimated_delivery_days:
        type: "NUMERIC"
        description: "Promised delivery days communicated to customer at checkout."
      late_orders_count:
        type: "INTEGER"
        description: "Count of delivered orders that exceeded estimated delivery date."
      pct_late_vs_estimated:
        type: "NUMERIC"
        description: "Percentage of delivered orders that were late (late_orders_count / total_delivered_orders * 100)."

metrics:
  total_revenue:
    formula: "SUM(total_revenue)"
    table: "marts.mart_daily_sales"
    description: "Gross merchandise revenue across all orders."
  average_order_value:
    formula: "SUM(total_revenue) / SUM(total_orders)"
    table: "marts.mart_daily_sales"
    description: "Weighted average revenue per order. Never average avg_order_value directly across multiple days."
  on_time_delivery_rate:
    formula: "ROUND((1.0 - (SUM(late_orders_count)::NUMERIC / SUM(total_delivered_orders)::NUMERIC)) * 100, 2)"
    table: "marts.mart_delivery_performance"
    description: "Percentage of orders delivered on or ahead of estimated delivery schedule."
  customer_lifetime_value:
    formula: "AVG(total_spend)"
    table: "marts.mart_customer_summary"
    description: "Average lifetime spend across buyers."
  repeat_buyer_count:
    formula: "COUNT(*) WHERE total_orders > 1"
    table: "marts.mart_customer_summary"
    description: "Count of customers who have made more than one purchase."

query_rules:
  - "Weighted averages: use SUM(numerator)/SUM(denominator); never AVG of pre-computed averages."
  - "Rolling or window calculations: compute them in a CTE over the full table first, then filter or LIMIT in the outer query."
  - "\"Last N recorded days/months\" means the last N rows ordered by date, not N calendar days."
  - "Prefer existing pre-computed columns (e.g. pct_late_vs_estimated) instead of recalculating."
  - "When combining the two monthly marts, join on year_month with an INNER JOIN."

canonical_examples:
  - question: "What is the monthly revenue trend for 2018?"
    sql: |
      SELECT DATE_TRUNC('month', sales_date)::DATE AS sales_month,
             SUM(total_revenue) AS monthly_revenue
      FROM marts.mart_daily_sales
      WHERE EXTRACT(YEAR FROM sales_date) = 2018
      GROUP BY 1
      ORDER BY 1 ASC;

  - question: "Which top 5 product categories have the highest revenue?"
    sql: |
      SELECT category_name, SUM(total_revenue) AS total_revenue
      FROM marts.mart_top_products
      GROUP BY category_name
      ORDER BY total_revenue DESC
      LIMIT 5;

  - question: "What is the overall on-time delivery rate?"
    sql: |
      SELECT ROUND((1.0 - (SUM(late_orders_count)::NUMERIC / SUM(total_delivered_orders)::NUMERIC)) * 100, 2) AS on_time_rate_pct
      FROM marts.mart_delivery_performance;

  - question: "Top 5 Brazilian states by customer count and total spend?"
    sql: |
      SELECT customer_state,
             COUNT(DISTINCT customer_unique_id) AS total_customers,
             SUM(total_spend) AS total_spend
      FROM marts.mart_customer_summary
      GROUP BY customer_state
      ORDER BY total_customers DESC
      LIMIT 5;

