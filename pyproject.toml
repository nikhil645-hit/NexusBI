[project]
name = "nexusbi"
version = "1.0.0"
description = "Conversational Business Intelligence & Modern Data Engineering Platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "dbt/olist_dbt/target",
    "dbt/olist_dbt/dbt_packages",
    "airflow/logs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501", # Line too long (handled by format / soft wraps)
    "E402", # Module level import not at top of file (needed for sys.path manipulation)
]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
python_files = ["test_*.py"]
