# ==============================================================================
# _marts__models.yml - Schema Definitions and Tests for Analytics Marts
# ==============================================================================

version: 2

models:
  - name: mart_daily_sales
    description: "Daily aggregated sales performance table for executive reporting"
    columns:
      - name: sales_date
        description: "Primary key date of sales transactions"
        tests:
          - unique
          - not_null
      - name: total_orders
        description: "Count of distinct non-canceled orders placed on this date"
        tests:
          - not_null
      - name: total_items_sold
        description: "Total line items ordered"
        tests:
          - not_null
      - name: total_revenue
        description: "Gross merchandise revenue (sum of item prices)"
        tests:
          - not_null
      - name: total_freight
        description: "Total freight charges collected"
        tests:
          - not_null
      - name: avg_order_value
        description: "Average gross revenue per order (total_revenue / total_orders)"
        tests:
          - not_null

  - name: mart_top_products
    description: "Product and category leaderboard ranked by revenue and units sold"
    columns:
      - name: product_id
        description: "Product identifier"
        tests:
          - unique
          - not_null
      - name: category_name
        description: "English product category"
      - name: units_sold
        description: "Total count of items sold"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue generated by this product"
        tests:
          - not_null
      - name: avg_unit_price
        description: "Average selling price per unit"
      - name: revenue_rank
        description: "Dense rank by total revenue (1 = top revenue generator)"
        tests:
          - not_null
      - name: units_sold_rank
        description: "Dense rank by volume of units sold"
        tests:
          - not_null

  - name: mart_customer_summary
    description: "Customer analytical summary profiling lifetime value and location"
    columns:
      - name: customer_unique_id
        description: "Primary key representing unique buyer across all transactions"
        tests:
          - unique
          - not_null
      - name: customer_city
        description: "Primary city of customer"
      - name: customer_state
        description: "Primary state of customer"
      - name: total_orders
        description: "Total non-canceled orders completed by this customer"
        tests:
          - not_null
      - name: total_spend
        description: "Total monetary expenditure (merchandise + freight)"
        tests:
          - not_null
      - name: first_order_date
        description: "Timestamp of earliest purchase"
      - name: last_order_date
        description: "Timestamp of latest purchase"

  - name: mart_delivery_performance
    description: "Monthly logistics fulfillment metrics tracking lead times and delays"
    columns:
      - name: year_month
        description: "Calendar year and month (YYYY-MM)"
        tests:
          - unique
          - not_null
      - name: order_month
        description: "Truncated date representing the first day of the month"
        tests:
          - not_null
      - name: total_delivered_orders
        description: "Total count of successfully delivered orders"
        tests:
          - not_null
      - name: avg_delivery_days
        description: "Average days elapsed from purchase to carrier delivery"
      - name: avg_estimated_delivery_days
        description: "Average estimated delivery duration committed to customer"
      - name: late_orders_count
        description: "Number of orders delivered past the estimated delivery date"
        tests:
          - not_null
      - name: pct_late_vs_estimated
        description: "Percentage of delivered orders that were late"
        tests:
          - not_null

