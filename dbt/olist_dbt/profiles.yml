# ==============================================================================
# profiles.yml - Warehouse Connection Profile for dbt-redshift
# All credentials are strictly read from environment variables (.env).
#
# In a viva: Explain that isolating warehouse connection details here allows
# swapping the data warehouse (e.g., to Snowflake or BigQuery) with zero changes
# to the underlying SQL business logic models.
# ==============================================================================

olist_dbt:
  target: dev
  outputs:
    dev:
      type: redshift
      host: "{{ env_var('REDSHIFT_HOST', 'localhost') }}"
      port: {{ env_var('REDSHIFT_PORT', '5439') | as_number }}
      user: "{{ env_var('REDSHIFT_DBT_USER', 'dbt_user') }}"
      password: "{{ env_var('REDSHIFT_DBT_PASSWORD', 'placeholder_dbt_password') }}"
      dbname: "{{ env_var('REDSHIFT_DB', 'dev') }}"
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'staging') }}"
      threads: 4
      keepalives_idle: 240
      connect_timeout: 30
      ra3_node: false

