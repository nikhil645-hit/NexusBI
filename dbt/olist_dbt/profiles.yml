# ==============================================================================
# profiles.yml - Warehouse Connection Profile for dbt-postgres
# All credentials are read from environment variables (.env).
#
# In a viva: Explain that dbt isolates warehouse connection details here,
# allowing our pipeline to run 100% locally on Postgres without cloud dependencies.
# ==============================================================================

olist_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: {{ env_var('WAREHOUSE_PORT', '5434') | as_number }}
      user: "{{ env_var('WAREHOUSE_DBT_USER', 'dbt_user') }}"
      password: "{{ env_var('WAREHOUSE_DBT_PASSWORD', 'dbt_user_password') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'warehouse') }}"
      schema: "{{ env_var('DBT_DEFAULT_SCHEMA', 'staging') }}"
      threads: 4
      keepalives_idle: 240
      connect_timeout: 30
