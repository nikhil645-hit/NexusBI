name: Keepalive Cloud Service Ping

# Free cloud database and app hosts (such as Neon and Streamlit Cloud) often spin down
# or sleep after periods of inactivity.
# DISABLED: Pings were configured to only hit the Streamlit app. Disabled per hardening policy.

on:
  # schedule:
  #   - cron: "0 8 * * 1" # Disabled: Streamlit app keepalive ping disabled per hardening policy
  workflow_dispatch:

jobs:
  ping:
    name: Ping Deployment Endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit Cloud & Cloud Database
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            echo "Pinging production application URL: $APP_URL"
            curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" -L "$APP_URL" || echo "Ping attempted with response."
          else
            echo "[INFO] No APP_URL secret configured in GitHub repository."
            echo "To keep your Streamlit Cloud demo alive, add an APP_URL secret in Repo Settings -> Secrets and variables -> Actions."
          fi
