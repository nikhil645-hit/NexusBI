name: CI Test Suite & Guardrail Verification

on:
  push:
    branches: [main, upgrades]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Benchmark Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run AST SQL Guardrail Tests
        run: |
          pytest -v tests/test_sql_guardrail.py

      - name: Run Text-to-SQL Benchmark (Smoke Test)
        run: |
          python benchmarks/run_benchmark.py --mock
